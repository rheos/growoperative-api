# =============================
# Docker Compose for Production (Lightsail)
#
# Services:
#   backend:  Rails API server
#   nginx:    Reverse proxy with SSL
#
# MySQL is on a separate Lightsail instance (172.26.13.168)
# =============================

services:
  backend:
    build:
      context: .
      args:
        RAILS_ENV: production
    restart: always
    env_file:
      - .env.production
    environment:
      RAILS_ENV: production
      PORT: 8080
    expose:
      - "8080"

  backend-demo:
    build:
      context: .
      args:
        RAILS_ENV: production
    restart: always
    env_file:
      - .env.demo
    environment:
      RAILS_ENV: production
      PORT: 8080
    expose:
      - "8080"

  # Beta backend — isolated on-demand env (own DB growoperative_beta, own auth
  # via bauth.foaf.io). Gated behind the "beta" compose profile so a normal
  # `up -d` never starts it, and restart:"no" so a reboot/daemon-restart won't
  # resurrect it. Bring it up only when testing develop: `bin/beta-up`. nginx
  # reaches it by name (backend-beta) via the docker resolver, so it is NOT in
  # nginx's depends_on and nginx loads fine while beta is down.
  backend-beta:
    profiles: ["beta"]
    build:
      context: .
      args:
        RAILS_ENV: production
    restart: "no"
    env_file:
      - .env.beta
    environment:
      RAILS_ENV: production
      PORT: 8080
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      # Maintenance page — served via `error_page 502 503 504` on every
      # block that proxies to a backend. Catches deploy windows, MySQL
      # CPU-credit exhaustion, container restarts.
      - ./nginx/maintenance.html:/var/www/maintenance/maintenance.html:ro
      # Production frontend (growoperative.app) — promoted manually via the
      # frontend repo's deploy-prod workflow.
      - /home/ubuntu/growoperative-app/dist-prod:/var/www/prod:ro
      # Demo / beta frontend (demo.growoperative.app + beta.growoperative.app)
      # — auto-deploys on every push to growoperative-app `main`.
      - /home/ubuntu/growoperative-app/dist-demo:/var/www/demo:ro
    depends_on:
      - backend
      - backend-demo

  # Auto-renews all Let's Encrypt certs every 12h. MUST stay running — if this
  # container is down, certs silently expire (api.growoperative.app lapsed
  # 2026-07-06 because this service had never been started). `restart: always`
  # keeps it up across reboots. Note: this renews the cert files on disk but
  # does NOT reload nginx — a host cron reloads nginx daily so the renewed cert
  # gets served (deploy-prod also force-recreates nginx). See the
  # reference_prod_lightsail_ssh_and_certs memory.
  certbot:
    image: certbot/certbot
    restart: always
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
