default: &default
  adapter: postgresql
  encoding: utf8
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") { "postgresql://postgres:postgres@localhost:5544/growoperative_development" } %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  # Reads TEST_DATABASE_URL (not DATABASE_URL) so a test run can never point at
  # the development database even when DATABASE_URL is set in the environment.
  url: <%= ENV.fetch("TEST_DATABASE_URL") { "postgresql://postgres:postgres@localhost:5544/growoperative_test" } %>

production:
  adapter: postgresql
  url: <%= ENV["DATABASE_URL"] %>
