# =============================
# Docker Compose for Local Dev
#
# Services:
#   db:       Postgres 16 database
#   backend:  Rails API server
#   frontend: React app (dev server)
#
# Key environment variables:
#   DATABASE_URL:      Postgres connection (dev); TEST_DATABASE_URL for the test DB
#   FRONTEND_URL:      URL for CORS and backend/frontend integration
#   SEED_DATABASE:     If "true", seeds DB on startup (dev only)
# =============================


services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres          # App DB user (matches config/database.yml)
      POSTGRES_PASSWORD: postgres      # App DB password (dev only)
      POSTGRES_DB: growoperative_development  # Default DB (test DB created via rails db:create)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d growoperative_development"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5544:5432"  # Expose Postgres for local tools (host 5544 avoids collisions)

  backend:
    build: .
    command: bundle exec rails server -b '0.0.0.0'
    volumes:
      - .:/app
      - bundle_data:/usr/local/bundle
    ports:
      - "127.0.0.1:3001:8080"  # Rails API on localhost:3001
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}  # Used for CORS
      SEED_DATABASE: "true"  # Auto-seed DB if empty (dev only)
      DATABASE_URL: postgresql://postgres:postgres@db:5432/growoperative_development
      TEST_DATABASE_URL: postgresql://postgres:postgres@db:5432/growoperative_test
      # The "db" service host trips DatabaseCleaner's remote-URL safeguard. It IS
      # the local dev DB, and test runs connect via TEST_DATABASE_URL, so allow it.
      DATABASE_CLEANER_ALLOW_REMOTE_DATABASE_URL: "true"
      DISABLE_SPRING: 1
      COOKIE_DOMAIN: localhost
      # Publish GrowOperative ledger writes to FOAF.
      FOAF_WRITE_ENABLED: ${FOAF_WRITE_ENABLED:-false}
      FOAF_API_URL: "http://host.docker.internal:3002"
      FOAF_SHARED_READS: ${FOAF_SHARED_READS:-false}
      FOAF_SHARED_WRITES: ${FOAF_SHARED_WRITES:-false}
      FOAF_SHARED_AUTH_VERIFIER: "false"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    profiles: [legacy-frontend]
    build: ../platform
    ports:
      - "3000:3000"  # React dev server on localhost:3000
    env_file:
      - ../platform/.env.local
    environment:
      - WDS_SOCKET_PORT=3000
      - CHOKIDAR_USEPOLLING=true  # For hot reload on some filesystems
    volumes:
      - ../platform:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pg_data:
  bundle_data:
