# Initial config - HTTP only, for Certbot certificate generation
events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name api.growoperative.app;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 200 'Growoperative API - SSL setup in progress';
            add_header Content-Type text/plain;
        }
    }
}
