events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    upstream rails {
        server backend:8080;
    }

    upstream rails_demo {
        server backend-demo:8080;
    }

    upstream foaf_testnet {
        server foaf-testnet:3002;
    }

    upstream foaf_production {
        server foaf-production:3002;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name api.growoperative.app;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server - API
    server {
        listen 443 ssl;
        server_name api.growoperative.app;

        ssl_certificate /etc/letsencrypt/live/api.growoperative.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.growoperative.app/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 50M;

        location / {
            proxy_pass http://rails;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Redirect HTTP to HTTPS - Production frontend
    server {
        listen 80;
        server_name growoperative.app;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server - Production frontend
    # Served from /var/www/prod (manual promotion from dist-demo).
    # API calls go to api.growoperative.app (handled by app's runtime config).
    server {
        listen 443 ssl;
        server_name growoperative.app;

        ssl_certificate /etc/letsencrypt/live/growoperative.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/growoperative.app/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /var/www/prod;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # Redirect HTTP to HTTPS - Beta frontend
    server {
        listen 80;
        server_name beta.growoperative.app;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server - Beta frontend
    # Alias for the demo environment — same dist, same backend, different URL.
    # demo.growoperative.app is the canonical name; beta.growoperative.app is
    # kept for anyone who has the URL bookmarked.
    server {
        listen 443 ssl;
        server_name beta.growoperative.app;

        ssl_certificate /etc/letsencrypt/live/beta.growoperative.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/beta.growoperative.app/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 50M;

        root /var/www/demo;
        index index.html;

        # API requests proxy to demo backend
        location /v1/ {
            proxy_pass http://rails_demo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else serves the frontend SPA
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # Redirect HTTP to HTTPS - Demo
    server {
        listen 80;
        server_name demo.growoperative.app;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server - Demo (frontend + API)
    # Same dist as beta.growoperative.app — both served from /var/www/demo.
    server {
        listen 443 ssl;
        server_name demo.growoperative.app;

        ssl_certificate /etc/letsencrypt/live/demo.growoperative.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/demo.growoperative.app/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 50M;

        root /var/www/demo;
        index index.html;

        # API requests proxy to demo backend
        location /v1/ {
            proxy_pass http://rails_demo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else serves the frontend SPA
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ============================================================
    # FOAF Protocol — testnet (dpi.foaf.io)
    # ============================================================

    server {
        listen 80;
        server_name dpi.foaf.io;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name dpi.foaf.io;

        ssl_certificate /etc/letsencrypt/live/dpi.foaf.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dpi.foaf.io/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 50M;

        location / {
            proxy_pass http://foaf_testnet;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ============================================================
    # FOAF Protocol — production (api.foaf.io)
    # ============================================================

    server {
        listen 80;
        server_name api.foaf.io;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name api.foaf.io;

        ssl_certificate /etc/letsencrypt/live/api.foaf.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.foaf.io/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 50M;

        location / {
            proxy_pass http://foaf_production;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
