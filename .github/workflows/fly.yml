name: Deploy to Fly.io
on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions/deploy@master
        with:
          app: "railsbackend"
          config: "fly.toml"
          strategy: "immediate"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }} 