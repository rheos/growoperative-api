# Scheduled liveness probe for the FOAF fleet.
#
# Why this exists: auth.foaf.io was down from 2026-09-19 to 2026-09-22 and
# nothing noticed. Three days. Every external check was green the whole time,
# because the health endpoints did not touch the database -- railsbackend's
# "/up" is a static proc and auth.foaf.io rendered a fixed hash. The only real
# signal was a backup job failing that nobody was watching.
#
# Two rules follow from that, and both are load-bearing here:
#
#   1. Probe something that reaches the DATABASE. A 200 from an endpoint that
#      cannot fail tells you nothing. Every probe below is chosen so that a
#      dead database produces a non-2xx.
#
#   2. Page a human. The page is a critical alert item in the alert service:
#      the page step creates it, or reopens it if it was closed, and that is
#      what pages. A repeat while the item is open sends the same fingerprint
#      and only groups onto it, so a sustained outage pages once rather than
#      every 15 minutes. That also means recovery MUST close the item. Closing
#      clears its fingerprints, so the next outage reopens it and pages again.
#      Without the recovery step every later outage is silent, and it is the
#      part most likely to be dropped in a rewrite.
#
# The alert service URL and token are repo secrets (CURRENT_API_URL and
# CURRENT_ALERT_TOKEN), read by name. The URL is a secret on purpose, so this
# public file names no host. Every call to the alert service uses curl -s,
# never -sS or -v, whose error text can print the host, and logs only HTTP
# codes and our own messages. No shell tracing anywhere in this file.
#
# Lives in a repo rather than a crontab on the box deliberately: hand-installed
# scripts on the server were removed in 2026-08 for bypassing deploy-from-main.

name: Health probe

on:
  schedule:
    # Every 15 minutes. GitHub schedules are best-effort and can slip by a few
    # minutes under load; that is fine for a 3-day-outage class of problem.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-probe
  cancel-in-progress: true

jobs:
  # Checked on EVERY run, not only when something is down. Otherwise a missing
  # secret or a lapsed token leaves the probe passing green while it cannot
  # page anyone: monitoring that looks healthy and cannot alert is the exact
  # failure this workflow exists to end, one level up.
  #
  # Its own job, once per run rather than once per matrix entry, because every
  # close by source writes an audit record in the alert service, a no-op
  # included. The close names a source_ref that is never filed, so it proves
  # the URL, the token and its scope without changing any item.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Preflight, can we actually page?
        env:
          CURRENT_API_URL: ${{ secrets.CURRENT_API_URL }}
          CURRENT_ALERT_TOKEN: ${{ secrets.CURRENT_ALERT_TOKEN }}
        run: |
          set -uo pipefail
          missing=0
          for name in CURRENT_API_URL CURRENT_ALERT_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::The $name repo secret is not set. This probe cannot page anyone, so it is not monitoring. Set the secret."
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1

          # Steps run under bash -e. A failed connection makes curl exit non-zero
          # after -w has printed 000, so "|| true" keeps that code and lets the
          # ::error:: line below run. The same holds for every alert call here.
          code=$(curl -s -o /tmp/preflight.json -w '%{http_code}' --max-time 20 \
                   -X POST "${CURRENT_API_URL%/}/api/v1/operations/current.item.close_by_source" \
                   -H "Authorization: Bearer $CURRENT_ALERT_TOKEN" \
                   -H "Content-Type: application/json" \
                   -d '{"source_kind":"health-probe","source_ref":"preflight:never-filed"}') || true
          if [ "$code" != "200" ] || ! jq -e '.state == "succeeded"' /tmp/preflight.json >/dev/null 2>&1; then
            echo "::error::The alert service answered HTTP $code to the preflight close. Paging would fail during a real outage."
            exit 1
          fi
          echo "The alert service is reachable and accepts the token for closing alert items."

  probe:
    name: ${{ matrix.service }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # auth.foaf.io — /v1/health runs SELECT 1 and 503s when the database
          # is unreachable (foaf-auth#33). This is the service that was down.
          - service: auth.foaf.io
            url: https://auth.foaf.io/v1/health
            method: GET
            expect: 200

          # api.growoperative.app — /v1/health, same shape (#100). NOT "/up",
          # which is a hardcoded proc and always returns 200.
          - service: api.growoperative.app
            url: https://api.growoperative.app/v1/health
            method: GET
            expect: 200

          # api.foaf.io — the ledger has no health endpoint yet, so probe a
          # real read instead: /api/v1/networks queries CurrencyNetwork, so a
          # dead database gives a 5xx rather than this 200.
          - service: api.foaf.io
            url: https://api.foaf.io/api/v1/networks
            method: GET
            expect: 200

    steps:
      - name: Probe
        id: probe
        run: |
          set -uo pipefail

          # Three attempts before declaring an outage. A single failed request
          # is usually a network blip on the runner, and a false page teaches
          # you to ignore the pager.
          code=000
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/body.txt -w '%{http_code}' \
                     --max-time 20 -X "${{ matrix.method }}" "${{ matrix.url }}" || echo 000)
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "${{ matrix.expect }}" ] && break
            [ "$attempt" -lt 3 ] && sleep 10
          done

          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "${{ matrix.expect }}" ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Page, create or reopen the critical alert item
        if: steps.probe.outputs.healthy == 'false'
        env:
          CURRENT_API_URL: ${{ secrets.CURRENT_API_URL }}
          CURRENT_ALERT_TOKEN: ${{ secrets.CURRENT_ALERT_TOKEN }}
          SERVICE: ${{ matrix.service }}
          URL: ${{ matrix.url }}
          CODE: ${{ steps.probe.outputs.code }}
          EXPECT: ${{ matrix.expect }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          # The response body goes in via --rawfile rather than interpolation:
          # it is attacker-adjacent text and may hold quotes or newlines. It is
          # cut to 400 bytes and appended last, so the body stays far below the
          # alert service's 20000 limit and the "Type:" first line is never cut.
          head -c 400 /tmp/body.txt > /tmp/body-trunc.txt 2>/dev/null || : > /tmp/body-trunc.txt

          body=$(printf '%s\n' \
            "Type: infra-alert" \
            "" \
            "Probe $URL returned HTTP $CODE, expected $EXPECT, after 3 attempts." \
            "" \
            "This probe reaches the database, so a non-2xx means the service cannot serve" \
            "real traffic, not merely that a static endpoint is missing." \
            "" \
            "Run: $RUN_URL")

          # source_kind + source_ref name the item, and the fixed fingerprint
          # "down" makes a repeat while it is open group silently instead of
          # paging again. So a sustained outage pages once.
          payload=$(jq -nc \
            --arg title "$SERVICE is DOWN (HTTP $CODE)" \
            --arg ref "health-probe:$SERVICE" \
            --arg body "$body" \
            --rawfile resp /tmp/body-trunc.txt \
            '{title:$title,
              body:($body + "\n\nResponse body (truncated):\n" + $resp),
              priority:"critical", area:"dev", provenance:"alert",
              source_kind:"health-probe", source_ref:$ref, fingerprint:"down"}')

          code=$(curl -s -o /tmp/alert-create.json -w '%{http_code}' --max-time 20 \
                   -X POST "${CURRENT_API_URL%/}/api/v1/operations/current.item.create" \
                   -H "Authorization: Bearer $CURRENT_ALERT_TOKEN" \
                   -H "Content-Type: application/json" \
                   -d "$payload") || true
          if [ "$code" != "200" ] || ! jq -e '.state == "succeeded"' /tmp/alert-create.json >/dev/null 2>&1; then
            echo "::error::The alert service answered HTTP $code. $SERVICE is DOWN and the alert item was not filed."
            exit 1
          fi

          action=$(jq -r '.result.action // ""' /tmp/alert-create.json 2>/dev/null)
          case "$action" in
            created|reopened|woke) echo "$SERVICE is down: alert item $action." ;;
            grouped) echo "$SERVICE is still down: grouped onto the open alert item, no new page." ;;
            *) echo "$SERVICE is down: alert item filed (HTTP $code)." ;;
          esac

      # Without this the first outage leaves an open item forever, every repeat
      # groups onto it, and every LATER outage is silent. One close per service
      # per run, by source, with no list and no patch. The close also clears the
      # item's fingerprints, even when someone already closed it by hand, so the
      # next outage reopens it and pages.
      - name: Close the alert item on recovery
        if: steps.probe.outputs.healthy == 'true'
        env:
          CURRENT_API_URL: ${{ secrets.CURRENT_API_URL }}
          CURRENT_ALERT_TOKEN: ${{ secrets.CURRENT_ALERT_TOKEN }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -uo pipefail
          payload=$(jq -nc --arg ref "health-probe:$SERVICE" \
                      '{source_kind:"health-probe", source_ref:$ref}')

          code=$(curl -s -o /tmp/alert-close.json -w '%{http_code}' --max-time 20 \
                   -X POST "${CURRENT_API_URL%/}/api/v1/operations/current.item.close_by_source" \
                   -H "Authorization: Bearer $CURRENT_ALERT_TOKEN" \
                   -H "Content-Type: application/json" \
                   -d "$payload") || true
          if [ "$code" != "200" ] || ! jq -e '.state == "succeeded"' /tmp/alert-close.json >/dev/null 2>&1; then
            echo "::error::The alert service answered HTTP $code to the recovery close for $SERVICE. Until a close succeeds, the next outage of $SERVICE may not page."
            exit 1
          fi

          if [ "$(jq -r '.result.closed' /tmp/alert-close.json)" = "true" ]; then
            echo "$SERVICE healthy; closed its alert item"
          else
            echo "$SERVICE healthy; nothing to close"
          fi

      - name: Fail the run if the service is down
        if: steps.probe.outputs.healthy == 'false'
        run: |
          echo "::error::${{ matrix.service }} returned HTTP ${{ steps.probe.outputs.code }} (expected ${{ matrix.expect }})"
          exit 1
