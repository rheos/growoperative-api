name: Deploy to Lightsail

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      # Both backend containers auto-run `rails db:migrate` on startup via
      # entrypoint.prod.sh (RAILS_ENV=production branch). Building backend-demo
      # alongside backend — and recreating it on `up -d` — ensures migrations
      # added since the last deploy apply to both databases without a manual
      # SSH step.
      - name: Deploy to Lightsail
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/key.pem ubuntu@$HOST "\
            cd ~/railsbackend && \
            git pull && \
            chmod +x docker-entrypoint.sh entrypoint.sh entrypoint.prod.sh bin/* && \
            sudo docker compose -f docker-compose.prod.yml build backend backend-demo && \
            sudo docker compose -f docker-compose.prod.yml up -d backend backend-demo && \
            sudo docker compose -f docker-compose.prod.yml restart nginx"
