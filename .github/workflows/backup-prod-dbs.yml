name: Backup prod databases

# Nightly logical backup of the three FOAF prod Neon databases to S3.
#
# ⚠️ 2026-09-26: this job dumped a DEAD DATABASE for four days and reported
# success every time. foaf-auth's Postgres moved off Neon to the Contabo box on
# 2026-09-22; NEON_FOAF_AUTH_PROD_URL was never repointed, so the job kept
# dumping the abandoned Neon database. The artifact was structurally perfect -
# 18 tables, complete-dump marker, right size - and frozen. Live prod had 414
# audit_logs to 2026-09-25; the "backup" had none past 2026-09-22.
#
# None of the gates below could have caught it, and that is worth understanding
# rather than patching: they all ask "is this a valid dump of A database", and
# it was. Even the identity count matched (18 = 18), because no new identity
# had been created since the migration. The only signal was a continuously
# growing table being frozen.
#
# So the fix is not another gate. foaf-auth is now dumped over SSH from the box
# the application actually runs on, resolving the container from the uuid in the
# app's own DATABASE_URL. The indirection that went stale - a connection string
# held as a secret, separate from where the app points - is gone for that
# service. The Neon-hosted services keep the secret-based path, and carry the
# same risk if one of them ever migrates: if you move a database, repoint or
# delete its secret in the same change.
#
# Why this exists as a workflow and not a host cron: the previous backup
# (scripts/backup_dbs.sh) was a cron meant to run on the Lightsail host. It was
# never installed there, nobody could tell from the repo, and the S3 bucket sat
# empty from May 2026 until it was noticed in September. Running it here keeps
# execution visible in version control, gives every run a public history, and
# survives any single host being rebuilt. See docs/BACKUP_RUNBOOK.md.
#
# Neon's free plan caps point-in-time restore at 6 hours and cannot be raised,
# so these dumps are the only recovery path beyond that window - and the only
# copy that lives outside the Neon account.

on:
  schedule:
    # 09:17 UTC ~ 02:17 PT. Off-peak, and offset from the top of the hour so it
    # does not collide with every other cron on the internet.
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: backup-prod-dbs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dump:
    name: Dump ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # One job per database: a failure on one is visible on its own rather than
    # hidden behind whichever database happened to be dumped first.
    strategy:
      fail-fast: false
      matrix:
        # min_tables is the real "is this the right database" gate. A dump of a
        # blank or wrong database is structurally valid and passes every other
        # check, but contains zero CREATE TABLE statements. Each floor is set
        # near half the table count observed on 2026-09-17 (39 / 18 / 9), which
        # catches a wrong-database dump outright while leaving room for ordinary
        # schema churn. If a legitimate migration trips one of these, raise it
        # in the same PR as the migration.
        include:
          - service: growoperative-api-prod
            source: neon
            secret: NEON_GROWOPERATIVE_API_PROD_URL
            min_tables: 20
          # foaf-auth's database moved OFF Neon to a Coolify-managed Postgres
          # on the Contabo box (2026-09-22, after a Neon free-tier compute
          # exhaustion caused a 3-day auth outage). The NEON_FOAF_AUTH_PROD_URL
          # secret was never repointed, so this job kept dumping the abandoned
          # Neon database and reporting success. See the header note.
          - service: foaf-auth-prod
            source: contabo
            pg_container: bmmum4w3d7v4wk37mi4gabeh
            pg_user: foaf_auth
            pg_database: foaf_auth_production
            min_tables: 9
          - service: foaf-protocol-prod
            source: neon
            secret: NEON_FOAF_PROTOCOL_PROD_URL
            min_tables: 5

    env:
      BACKUP_BUCKET: growoperative-backups
      AWS_DEFAULT_REGION: us-west-2

    steps:
      - name: Install PostgreSQL 16 client
        # Neon prod runs PostgreSQL 16. pg_dump must be >= the server version,
        # so pin the client rather than taking whatever ubuntu-latest ships.
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
          https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          pg_dump --version

      - name: Set up SSH (Contabo-hosted databases only)
        if: matrix.source == 'contabo'
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/contabo
          chmod 600 ~/.ssh/contabo
          ssh-keyscan -H 144.126.145.4 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Dump, verify, and upload
        env:
          DATABASE_URL: ${{ secrets[matrix.secret] }}
          SOURCE: ${{ matrix.source }}
          PG_CONTAINER: ${{ matrix.pg_container }}
          PG_USER: ${{ matrix.pg_user }}
          PG_DATABASE: ${{ matrix.pg_database }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          SERVICE: ${{ matrix.service }}
          MIN_TABLES: ${{ matrix.min_tables }}
        run: |
          # pipefail is load-bearing: without it, `pg_dump | gzip` reports
          # gzip's exit status and a failed dump would upload happily as a
          # valid-looking empty archive.
          set -euo pipefail

          ts="$(date -u +%Y-%m-%dT%H%MZ)"
          out="${RUNNER_TEMP}/${SERVICE}_${ts}.sql.gz"

          if [ "${SOURCE}" = "contabo" ]; then
            # Dump over SSH from the box the application actually runs on,
            # resolving the Postgres container by the uuid in the app's own
            # DATABASE_URL. No connection string is stored as a secret here,
            # which is the point: the previous failure was a STALE SECRET
            # pointing at a database the app had stopped using, and no gate
            # below can catch that - a dump of an abandoned database is
            # structurally perfect.
            echo "Dumping ${SERVICE} from Contabo container ${PG_CONTAINER} ..."
            ssh -i ~/.ssh/contabo -o BatchMode=yes root@144.126.145.4 \
              "docker exec \$(docker ps --format '{{.Names}}' | grep '^${PG_CONTAINER}' | head -1) \
                 pg_dump -U '${PG_USER}' -d '${PG_DATABASE}' \
                 --format=plain --no-owner --no-privileges --quote-all-identifiers" \
              | gzip -6 > "$out"
          else
            if [ -z "${DATABASE_URL:-}" ]; then
              echo "::error::secret ${{ matrix.secret }} is empty or unset"
              exit 1
            fi
            echo "Dumping ${SERVICE} from Neon ..."
            pg_dump "$DATABASE_URL" \
              --format=plain \
              --no-owner \
              --no-privileges \
              --quote-all-identifiers \
              | gzip -6 > "$out"
          fi

          # Integrity gate. pg_dump writes this marker as the final line of a
          # complete dump; a dump truncated by a dropped connection or a killed
          # process will not have it. Checking the marker catches a partial
          # dump that a size check alone would wave through.
          if ! gzip -dc "$out" | tail -5 | grep -q "PostgreSQL database dump complete"; then
            echo "::error::${SERVICE} dump is missing its completion marker - refusing to upload a truncated backup"
            exit 1
          fi

          # Content gate. These databases are small - the gzipped dumps are tens
          # of kilobytes, not megabytes, because most of Neon's reported size is
          # index and catalog overhead rather than rows. So size alone cannot
          # tell a real dump from a blank one; the table count can.
          tables="$(gzip -dc "$out" | grep -c '^CREATE TABLE' || true)"
          if [ "$tables" -lt "$MIN_TABLES" ]; then
            echo "::error::${SERVICE} dump has only ${tables} tables, expected at least ${MIN_TABLES} - wrong or empty database, refusing to upload"
            exit 1
          fi

          # Backstop against a pathologically small archive that somehow cleared
          # both checks above.
          bytes="$(wc -c < "$out")"
          if [ "$bytes" -lt 5000 ]; then
            echo "::error::${SERVICE} dump is only ${bytes} bytes - refusing to upload"
            exit 1
          fi

          echo "${SERVICE}: ${bytes} bytes gzipped, ${tables} tables, marker present"

          key="${SERVICE}/${ts}.sql.gz"
          aws s3 cp "$out" "s3://${BACKUP_BUCKET}/${key}" --only-show-errors

          # Confirm from the bucket's side, not from the exit code of the
          # upload. This is the check that would have caught the old script:
          # prove the object is actually there before calling the run green.
          remote_bytes="$(aws s3api head-object \
            --bucket "$BACKUP_BUCKET" --key "$key" \
            --query 'ContentLength' --output text)"

          if [ "$remote_bytes" != "$bytes" ]; then
            echo "::error::uploaded size ${remote_bytes} != local size ${bytes} for ${key}"
            exit 1
          fi

          echo "Verified s3://${BACKUP_BUCKET}/${key} (${remote_bytes} bytes)"
          echo "### ${SERVICE}" >> "$GITHUB_STEP_SUMMARY"
          echo "Uploaded \`s3://${BACKUP_BUCKET}/${key}\` - ${remote_bytes} bytes, ${tables} tables." >> "$GITHUB_STEP_SUMMARY"
