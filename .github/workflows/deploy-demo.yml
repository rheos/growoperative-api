name: Deploy backend to Demo (Lightsail)

# Auto-deploys every push to master to the demo backend
# (demo.growoperative.app -> backend-demo container, .env.demo, demo MySQL DB).
# Demo doubles as our beta soak environment. Production (api.growoperative.app)
# is promoted manually via the deploy-prod workflow once changes have soaked.

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy backend-demo
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Lightsail
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/key.pem ubuntu@$HOST "\
            cd ~/railsbackend && \
            git fetch origin master && \
            git checkout master && \
            git pull && \
            chmod +x docker-entrypoint.sh entrypoint.sh entrypoint.prod.sh bin/* && \
            sudo docker compose -f docker-compose.prod.yml build backend-demo && \
            sudo docker compose -f docker-compose.prod.yml up -d backend-demo nginx && \
            sudo docker exec railsbackend-nginx-1 nginx -t && \
            sudo docker exec railsbackend-nginx-1 nginx -s reload"
