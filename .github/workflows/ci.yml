name: Rails upgrade safety

on:
  pull_request:
  push:

jobs:
  rspec-upgrade-safety:
    name: RSpec upgrade safety
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: growoperative_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      RAILS_ENV: test
      # `config/database.yml` deliberately reads TEST_DATABASE_URL for the
      # test environment, preventing a test run from ever using development.
      # The GitHub Actions Postgres service is exposed on port 5432.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/growoperative_test
      SECRET_KEY_BASE: ci-secret-key-base
      FOAF_AUTH_BASE_URL: http://localhost:3013
      FOAF_AUTH_PUBLIC_BASE_URL: https://auth.foaf.io
      FOAF_AUTH_SERVICE_TOKEN: ci-service-token
      EXPO_ACCESS_TOKEN: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev imagemagick libmagickwand-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.11
          bundler-cache: true

      - name: Prepare test database
        run: bundle exec rails db:test:prepare

      - name: Test FOAF trade harness guards
        run: python3 scripts/test_trade_test.py

      - name: Test FOAF demo reset guards
        run: python3 scripts/test_foaf_reset_demo.py

      # Temporary Rails-upgrade gate. The historical full suite is currently
      # red on stale legacy scenario specs; expand this back to bare `rspec`
      # once those baseline failures are retired.
      - name: Run upgrade-safety specs
        run: >
          bundle exec rspec
          spec/requests/foaf_auth_round_trip_contract_spec.rb
          spec/services/auth_jwks_verifier_spec.rb
          spec/controllers/job36_auth_resolution_spec.rb
          spec/controllers/v1_auth_envelope_spec.rb
          spec/controllers/sessions_cookie_attributes_spec.rb
          spec/controllers/jwt_aud_enforcement_spec.rb
          spec/controllers/jwt_hs256_bridge_sunset_spec.rb
          spec/controllers/jwt_bridge_resolution_spec.rb
          spec/services/jwt_generation_service_spec.rb
          spec/requests/discovery_spec.rb
          spec/models/foaf_outbox_entry_spec.rb
          spec/services/foaf/ledger_hooks_limit_outbox_spec.rb
          spec/services/foaf/publisher_limit_outbox_spec.rb
          spec/services/foaf/replay_worker_spec.rb
