name: Rails upgrade safety

on:
  pull_request:
  push:

jobs:
  rspec-upgrade-safety:
    name: RSpec upgrade safety
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: growoperative_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      RAILS_ENV: test
      # `config/database.yml` deliberately reads TEST_DATABASE_URL for the
      # test environment, preventing a test run from ever using development.
      # The GitHub Actions Postgres service is exposed on port 5432.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/growoperative_test
      SECRET_KEY_BASE: ci-secret-key-base
      FOAF_AUTH_BASE_URL: http://localhost:3013
      FOAF_AUTH_PUBLIC_BASE_URL: https://auth.foaf.io
      FOAF_AUTH_SERVICE_TOKEN: ci-service-token
      EXPO_ACCESS_TOKEN: ""

    steps:
      - uses: actions/checkout@v7

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev imagemagick libmagickwand-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.11
          bundler-cache: true

      - name: Prepare test database
        run: bundle exec rails db:test:prepare

      - name: Test FOAF trade harness guards
        run: python3 scripts/test_trade_test.py

      - name: Test FOAF demo reset guards
        run: python3 scripts/test_foaf_reset_demo.py

      # Ran the full suite locally (clean container, isolated Postgres) on 2026-09-17:
      # 699 examples, 0 failures, 16 pending (stub specs marked "not yet implemented" +
      # one integration spec gated behind INTEGRATION=1). The "full suite is red on
      # legacy specs" premise that narrowed this job to a hand-picked list no longer
      # holds — back to the real suite.
      - name: Run RSpec
        run: bundle exec rspec
