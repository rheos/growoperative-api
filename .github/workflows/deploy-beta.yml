name: Deploy backend to Beta (Lightsail)

# Auto-deploys pushes to `beta-backend` to the on-demand beta backend
# (beta.growoperative.app -> bpi.growoperative.app -> backend-beta container,
# .env.beta, growoperative_beta DB). Beta is the isolated soak env for the app's
# `develop` frontend. Mirrors deploy-demo.yml, with three deliberate differences:
#   - deploys from the `beta-backend` branch (introductions + local-discovery), not master;
#   - builds/ups ONLY backend-beta behind the `beta` profile — auth-beta is left
#     untouched so the beta signing-key/login fix is never reverted;
#   - does NOT recreate nginx (bpi is routed via nginx's runtime resolver — no reload needed).
# The backend-beta entrypoint runs pending migrations on growoperative_beta on boot.

on:
  push:
    branches:
      - beta-backend
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy backend-beta
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Lightsail
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/key.pem ubuntu@$HOST "\
            cd ~/railsbackend && \
            git fetch origin beta-backend && \
            git checkout beta-backend && \
            git pull && \
            chmod +x docker-entrypoint.sh entrypoint.sh entrypoint.prod.sh bin/* && \
            sudo docker compose -f docker-compose.prod.yml --profile beta build backend-beta && \
            sudo docker compose -f docker-compose.prod.yml --profile beta up -d backend-beta"
