name: Deploy backend to Production (Lightsail)

# Manual promotion of the backend to production (api.growoperative.app).
# Run from the GitHub Actions UI -> "Deploy backend to Production" -> Run workflow.
# Defaults to current master HEAD; pass a specific commit SHA to deploy something
# older (e.g. to roll back). Demo (demo.growoperative.app) auto-deploys on every
# push to master via deploy-demo.yml; this workflow is the soak-tested promotion.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to deploy (leave blank for current master HEAD)'
        required: false
        type: string
      confirm:
        description: 'Type "deploy-prod" to confirm'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy backend (production)
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy-prod" ]; then
            echo "Confirmation string did not match 'deploy-prod'. Aborting."
            exit 1
          fi

      - name: Deploy to Lightsail
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SHA: ${{ github.event.inputs.sha }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts 2>/dev/null

          TARGET="${SHA:-master}"

          ssh -i ~/.ssh/key.pem ubuntu@$HOST "\
            cd ~/railsbackend && \
            git fetch --all && \
            git checkout $TARGET && \
            ( git symbolic-ref -q HEAD >/dev/null && git pull || true ) && \
            chmod +x docker-entrypoint.sh entrypoint.sh entrypoint.prod.sh bin/* && \
            sudo docker compose -f docker-compose.prod.yml build backend && \
            sudo docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps backend && \
            sudo docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload"
